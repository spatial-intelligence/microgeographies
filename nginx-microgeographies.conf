# microgeographies — HTTPS site + /api/sam proxy to the Node proxy (port 3001).
# 1. Point server_name at your host, set root to this folder.
# 2. Get a cert (e.g. `certbot --nginx`) and fix the ssl_certificate lines.
# 3. Run the proxy: SAM_UPSTREAM_URL=... SAM_TOKEN=... node server/proxy.mjs

server {
    listen 80;
    server_name microgeographies.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name microgeographies.example.com;

    ssl_certificate     /etc/letsencrypt/live/microgeographies.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/microgeographies.example.com/privkey.pem;

    root /var/www/microgeographies;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/sam {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        client_max_body_size 25m;
        proxy_read_timeout 120s;
    }
}
