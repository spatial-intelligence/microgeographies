<!doctype html><html><head><meta charset="utf-8"><title>MicroGeo v0.15 viewer verification</title><link rel="stylesheet" href="/viewer-navigation.css"><script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script><style>body{margin:20px;background:#eef0f3;color:#142b4a;font:16px system-ui}#view{position:relative;height:75vh;overflow:hidden;border-radius:12px}#view canvas{display:block;width:100%;height:100%}button{padding:10px;margin:4px;border:1px solid #bdc9da;border-radius:6px;background:white;color:#142b4a}.identify-tooltip{position:absolute;background:#142b4a;color:white;padding:8px}</style></head><body><h2>SLAM-image-1 viewer port - v0.15</h2><button id="fit">Fit view</button><button id="top">Top</button><button id="roll">Reset roll</button><button id="plus">Zoom +</button><button id="minus">Zoom -</button><p id="status">Loading saved reference cloud?</p><div id="view"></div><script type="module">
try {const {createViewer}=await import('/sfm3d.js');const buf=await (await fetch('/reference-cloud.bin')).arrayBuffer();const dv=new DataView(buf),n=buf.byteLength/24,pos=new Float32Array(n*3),rgb=new Float32Array(n*3);for(let i=0;i<n;i++)for(let j=0;j<3;j++){pos[i*3+j]=dv.getFloat32(i*24+j*4,true);rgb[i*3+j]=dv.getUint8(i*24+12+j)/255;}const v=createViewer(document.querySelector('#view'));v.setCloud(pos,rgb,rgb);document.querySelector('#status').textContent=n.toLocaleString()+' points from the other app's saved cloud';for(const [id,fn] of [['fit',()=>v.fitBounds()],['top',()=>v.topView()],['roll',()=>v.resetRoll()],['plus',()=>v.zoomBy(1.25)],['minus',()=>v.zoomBy(.8)]])document.getElementById(id).onclick=fn;}catch(e){document.querySelector('#status').textContent='ERROR: '+e.message;}
</script></body></html>
